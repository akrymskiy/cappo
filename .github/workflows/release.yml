name: Release

# Pushing a tag such as v0.9.0 or v0.9.0-beta.1:
# - publishes the GitHub build (trimmed, self-contained, unsigned) for x64 and ARM64 as CapPo_<version>_<arch>.zip,
#   with SHA-256 checksums, on a GitHub release (a prerelease when the tag has a suffix);
# - builds the Store build's packages for both and bundles them, unsigned, into CapPo_<version>.msixupload
#   (artifact CapPo_Store) to upload to Partner Center, which signs them for the Microsoft Store.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, ARM64]
        # Separate jobs: both builds share obj\, and a clean checkout keeps one from picking up the other's leftovers.
        flavor: [GitHub, Store]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # v0.9.0-beta.1 -> version 0.9.0-beta.1 for the app, 0.9.<run number>.0 for the Store package. A package version
      # is four numbers that must grow with each release, so installing one over another is an upgrade; the Store
      # also wants the last one 0. The run number grows with every release, whatever the patch number does.
      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $core = ($version -split '[-+]')[0]
          if ($core -notmatch '^(\d+)\.(\d+)\.\d+$') { throw "Tag ${{ github.ref_name }} isn't vMAJOR.MINOR.PATCH[-suffix]." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "package=$($Matches[1]).$($Matches[2]).${{ github.run_number }}.0" >> $env:GITHUB_OUTPUT

      - name: Test
        if: matrix.platform == 'x64' && matrix.flavor == 'GitHub'
        run: dotnet test --solution CapPo.slnx -c Release -p:Platform=x64

      # The GitHub build: a folder to unzip anywhere and run. LICENSE goes with it, as the GPL asks.
      - name: Publish the GitHub build
        if: matrix.flavor == 'GitHub'
        shell: pwsh
        run: |
          $name = 'CapPo_${{ steps.version.outputs.version }}_${{ matrix.platform }}'
          $folder = "$env:RUNNER_TEMP\$name\CapPo"
          dotnet publish src/CapPo.App -c Release -p:Platform=${{ matrix.platform }} -p:Version=${{ steps.version.outputs.version }} -o $folder
          if ($LASTEXITCODE) { throw "dotnet publish failed ($LASTEXITCODE)" }
          Get-ChildItem $folder -Filter '*.pdb' | Remove-Item
          Copy-Item LICENSE $folder
          # The zip holds a CapPo folder, so unzipping it doesn't scatter 300 files.
          Compress-Archive $folder "$env:RUNNER_TEMP\$name.zip" -CompressionLevel Optimal
          Get-Item "$env:RUNNER_TEMP\$name.zip" | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        if: matrix.flavor == 'GitHub'
        with:
          name: CapPo_${{ matrix.platform }}
          path: ${{ runner.temp }}/CapPo_*.zip
          if-no-files-found: error

      - name: Set the package version
        if: matrix.flavor == 'Store'
        shell: pwsh
        run: |
          $path = 'src/CapPo.App/Package.appxmanifest'
          [xml] $manifest = Get-Content $path -Raw
          $manifest.Package.Identity.Version = '${{ steps.version.outputs.package }}'
          $manifest.Save((Resolve-Path $path))

      # Unsigned: the Store signs it.
      - name: Build the Store package
        if: matrix.flavor == 'Store'
        shell: pwsh
        run: >
          dotnet build src/CapPo.App -c Release -p:Platform=${{ matrix.platform }} -p:StoreBuild=true
          -p:Version=${{ steps.version.outputs.version }}
          -p:GenerateAppxPackageOnBuild=true -p:AppxBundle=Never -p:AppxPackageSigningEnabled=false
          -p:AppxPackageDir="$env:RUNNER_TEMP\AppPackages\"

      - name: Keep the package for the bundle
        if: matrix.flavor == 'Store'
        shell: pwsh
        run: |
          $built = Get-ChildItem "$env:RUNNER_TEMP\AppPackages" -Directory | Select-Object -First 1
          $store = New-Item "$env:RUNNER_TEMP\Store" -ItemType Directory
          Copy-Item (Get-ChildItem $built -Filter '*.msix' | Select-Object -First 1) "$store\CapPo_${{ matrix.platform }}.msix"

      - uses: actions/upload-artifact@v7
        if: matrix.flavor == 'Store'
        with:
          name: Store_${{ matrix.platform }}
          path: ${{ runner.temp }}/Store/*.msix
          if-no-files-found: error

  # Both architectures in one bundle, as Partner Center takes them. Not part of the GitHub release: unsigned, it
  # installs nowhere but through the Store.
  store:
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Store_*
          path: store
          merge-multiple: true

      - name: Bundle
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          # The packages' version (see the package job), or makeappx makes one up from the date.
          if ($version -notmatch '^(\d+)\.(\d+)\.') { throw "Tag ${{ github.ref_name }} isn't vMAJOR.MINOR.PATCH[-suffix]." }
          $packageVersion = "$($Matches[1]).$($Matches[2]).${{ github.run_number }}.0"
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName | Select-Object -Last 1
          $bundle = "$env:RUNNER_TEMP\CapPo_$version.msixbundle"
          & $makeappx bundle /d store /p $bundle /bv $packageVersion /o
          if ($LASTEXITCODE) { throw "makeappx failed ($LASTEXITCODE)" }
          # An .msixupload is a zip of the bundle (and, optionally, symbols).
          Compress-Archive $bundle "$env:RUNNER_TEMP\CapPo_$version.zip"
          Move-Item "$env:RUNNER_TEMP\CapPo_$version.zip" "$env:RUNNER_TEMP\CapPo_$version.msixupload"

      - uses: actions/upload-artifact@v7
        with:
          name: CapPo_Store
          path: ${{ runner.temp }}/CapPo_*.msixupload
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: CapPo_*64
          path: packages
          merge-multiple: true

      # The exe isn't code-signed, so a checksum is the way to tell a download is the one built here.
      - name: Checksums
        working-directory: packages
        run: sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=$([[ "${{ github.ref_name }}" == *-* ]] && echo --prerelease || true)
          gh release create "${{ github.ref_name }}" packages/*.zip packages/SHA256SUMS.txt $prerelease \
            --title "CapPo ${{ github.ref_name }}" --notes-file .github/release-notes.md --generate-notes
