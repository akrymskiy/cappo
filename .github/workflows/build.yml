name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, ARM64]
        flavor: [GitHub, Store]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build src/CapPo.App -c Release -p:Platform=${{ matrix.platform }} -p:StoreBuild=${{ matrix.flavor == 'Store' }}

      - name: Test
        if: matrix.platform == 'x64' && matrix.flavor == 'GitHub'
        run: dotnet test --solution CapPo.slnx -c Release -p:Platform=x64
